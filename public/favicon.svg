<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#2f4858"/>
  <!-- WS, not W: a lone W on a deep blue square reads as Wikipedia at icon
       size, and this app already leans on Wiktionary data — the resemblance
       would look like a claim it is not making. The S is set lighter and
       smaller, so the pair still has a clear first letter rather than two
       characters competing. -->
  <text x="26" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#faf7f2" text-anchor="middle">W</text>
  <text x="45" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#faf7f2" fill-opacity="0.72" text-anchor="middle">S</text>
</svg>
